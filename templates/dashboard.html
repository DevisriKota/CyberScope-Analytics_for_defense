<!DOCTYPE html>
<html>
<head>
  <title>CyberScope | Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 14px;
    }
    .dash{
      width:100%;
      max-width:980px;
      border-radius:22px;
      background:rgba(0,0,0,0.35);
      box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 18px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      padding:28px;
    }
    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .title{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .title h1{
      margin:0;
      font-size:42px;
      letter-spacing:0.3px;
      line-height:1.1;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(0,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(0,255,255,0.25);
      font-weight:700;
      font-size:13px;
      margin-top:6px;
      white-space:nowrap;
    }
    .pillrow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
      font-size:13px;
    }
    .pill b{ font-weight:800; }
    .sub{
      margin:8px 0 0 0;
      opacity:0.85;
      font-size:14px;
      line-height:1.4;
      max-width:520px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:14px;
      margin:18px 0 16px 0;
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: 1fr; }
      .title h1{ font-size:34px; }
    }
    .card{
      border-radius:16px;
      padding:16px 16px 14px 16px;
      background:rgba(0,0,0,0.25);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .card .k{ opacity:0.85; font-size:13px; }
    .card .v{ margin-top:6px; font-size:26px; font-weight:900; letter-spacing:0.2px; }

    .actions{
      display:grid;
      gap:12px;
      margin-top:6px;
    }
    .btn-wide{
      width:100%;
      padding:14px 16px;
      border-radius:14px;
      font-weight:800;
      letter-spacing:0.3px;
    }
    .btn-secondary{
      background:rgba(255,255,255,0.06);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    .footer-note{
      margin-top:14px;
      opacity:0.75;
      font-size:12.5px;
      line-height:1.35;
      border-top:1px solid rgba(255,255,255,0.10);
      padding-top:12px;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="dash">

      <div class="top">
        <div>
          <div class="title">
            <h1>Dashboard</h1>
            <span class="badge">✅ Session Active</span>
          </div>

          <div class="pillrow">
            <span class="pill">User: <b>{{ user }}</b></span>
            <span class="pill">IP: <b>{{ ip }}</b></span>
          </div>

          <p class="sub">
            Adaptive authentication monitoring is enabled. Use Analytics to review attacks, risk scores,
            lockouts, and top attacking IPs in real time.
          </p>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="k">Session</div>
          <div class="v">Active</div>
        </div>
        <div class="card">
          <div class="k">Mode</div>
          <div class="v">Monitoring</div>
        </div>
        <div class="card">
          <div class="k">Controls</div>
          <div class="v">Adaptive</div>
        </div>
      </div>

      <div class="actions">
        <a href="/analytics"><button class="btn-wide">View Security Analytics</button></a>
        <a href="/logout"><button class="btn-wide btn-secondary">Logout</button></a>
      </div>

      

    </div>
  </div>
</body>
</html>
